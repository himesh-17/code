name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Audit dependencies
        run: pip install pip-audit && pip-audit || true   # informational, not a gate
      - name: Tests (mock provider — no API spend)
        env:
          LLM_PROVIDER: mock
          JWT_SECRET: ci-only-secret-not-used-in-prod
        run: python -m pytest -q
      - name: Accuracy benchmark (mock gate)
        env: { LLM_PROVIDER: mock }
        run: python -m bench.evaluate --mock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check + build
        run: pnpm build
